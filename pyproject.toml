[project]
name = "glasshouse"
version = "0.1.0a0"
description = "The open ETRM core for European power. Trades, curves, positions, P&L and audit, without the black box."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Jordan Dimov", email = "jdimov@a115.co.uk" }]
requires-python = ">=3.13"
# Floors state the majors the code is actually written against, not the
# oldest that once resolved: the lock has long carried these lines
# (structlog 26, mypy 2, pytest 9), and a lowest-resolution install must
# not silently pull a pre-major release the config no longer fits.
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.50",
    "psycopg[binary,pool]>=3.3.4",
    "alembic>=1.18",
    "structlog>=26.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "pytest-randomly>=4.0",
    "hypothesis>=6.161.2",
    "httpx2>=2.12",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glasshouse"]

[tool.ruff]
line-length = 100
target-version = "py313"
# The generated client is committed byte-exact (the drift check is
# regenerate-and-diff against the binary), so our formatters and
# linters must never touch it.
extend-exclude = ["src/glasshouse/commit/morpholog_client"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff's own
    "A",    # builtins shadowing
    "ARG",  # unused arguments
    "DTZ",  # naive datetimes - law 9 as a lint rule
    "ERA",  # commented-out code
    "FURB", # modernisation
    "G",    # logging format
    "ISC",  # implicit string concatenation
    "N",    # naming
    "PERF", # performance
    "PT",   # pytest style
    "PTH",  # pathlib over os.path
    "RET",  # return discipline
    "SLF",  # private-member access
    "T20",  # stray prints
    "PLC",  # pylint conventions
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    # Added 23/08/2026, each trialled against the codebase first and
    # every one of them already clean - they cost nothing today and
    # refuse a regression tomorrow, which is the only reason to take a
    # rule you are not currently failing.
    "ASYNC", # blocking calls inside async def
    "BLE",   # blind except
    "ICN",   # import naming conventions
    "LOG",   # logging misuse
    "PGH",   # blanket noqa / blanket type: ignore
    "PIE",   # miscellaneous simplifications
    "PYI",   # stub-file correctness
    "RSE",   # raise cleanliness
    "SLOT",  # __slots__ on subclasses of immutables
    "T10",   # stray debugger imports
    "TID",   # tidy imports
    "YTT",   # sys.version misuse
    # Added 28/08/2026: the stable rules ruff 0.16's own recommended
    # categories carry that our groups do not, taken BY CODE because
    # each comes from a group refused as a whole (PLR thresholds, TRY003,
    # bandit, the import-moving half of TC, pydocstyle); these are the
    # correctness rules inside those groups, all clean when trialled.
    "PLR0124", "PLR0133", "PLR0206", "PLR0402", "PLR1704", "PLR1708",
    "PLR1711", "PLR1716", "PLR1722", "PLR1730", "PLR1733", "PLR1736",
    "PLR2044",
    "TRY004", "TRY201", "TRY203", "TRY401",
    "S110", "S112",
    "TC004", "TC005", "TC007", "TC010",
    "COM818", "D301", "D419",
    # Added 28/08/2026 with the move to `Annotated` dependencies, which
    # also retired the B008 exemption for calls in argument defaults.
    "FAST",  # FastAPI idioms
]
ignore = [
    # House doctrine: money and quantities are Decimal FROM STRINGS,
    # uniformly - even where an int literal would be exact. FURB157's
    # Decimal("10") -> Decimal(10) fix is correct but off-doctrine.
    "FURB157",
]

[tool.ruff.lint.per-file-ignores]
# Fixture-dependency parameters and stub signatures are idiomatic in
# tests; "unused argument" is usually the point.
"tests/**" = ["ARG"]
# print IS the CLI's interface.
"src/glasshouse/cli.py" = ["T20"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    # Added 23/08/2026, all clean when trialled. `explicit-override` is
    # the one with a scar behind it: v0.0.8 renamed a generated method
    # and our override of it silently became a dead function carrying
    # the deployment's writer-role assertion nowhere (contract doc
    # section 22). `@override` makes the next such rename a type error.
    "explicit-override",
    # A deprecated library API should surface when we upgrade to the
    # release that deprecates it, not when a later one deletes it.
    "deprecated",
    "mutable-override",
    "truthy-iterable",
    "unused-awaitable",
    "exhaustive-match",
    "narrowed-type-not-subtype",
]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# Generated, byte-pinned, tested upstream against the binary's own
# goldens; our strictness applies to our code.
[[tool.mypy.overrides]]
module = "glasshouse.commit.morpholog_client.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Coverage is opt-in locally (`uv run pytest --cov`) and enforced in
# CI's integration job, where the full suite runs. The generated client
# is omitted: byte-pinned, tested upstream against the binary's own
# goldens; measuring it would count surfaces we deliberately do not use.
[tool.coverage.run]
branch = true
source = ["glasshouse"]
omit = ["*/glasshouse/commit/morpholog_client/*"]

[tool.coverage.report]
precision = 1
show_missing = true

# Mutation testing for the pure compute core - the quality measure
# behind the line-coverage number. Not in CI (it copies the tree and
# runs the suite per mutant); run on demand:
#   uv run --with mutmut mutmut run && uv run --with mutmut mutmut results
[tool.mutmut]
source_paths = ["src/glasshouse/compute/curves.py", "src/glasshouse/compute/valuation.py"]
also_copy = ["src/glasshouse", "alembic", "alembic.ini", "tests"]
