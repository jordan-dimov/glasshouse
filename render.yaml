# Render Blueprint: the DEMO profile (DESIGN.md section 13).
# Deliberately minimal: one web service with the background-thread
# projector (started by the lifespan in the demo environment), one
# managed Postgres, one nightly reset job. The separate worker (outbox +
# projector) is the production-like profile and joins a deployment only
# when external effects or projection lag force it.
#
# First boot: the web service's preDeployCommand provisions everything
# non-destructively (app schema to head, governed schema init, sealed
# views), so the service comes up serving an empty ledger; trigger the
# seed-reset cron once (or run it as a one-off job) to load the demo
# dataset. GLASSHOUSE_DEMO_PASSWORD is prompted at Blueprint creation
# (sync: false) and never enters this repository; the demo login is
# HTTP Basic, username "demo".
#
# Database: Render managed Postgres 18. TimescaleDB is supported on
# Render managed Postgres (PG13+, for databases created after 12/01/2023),
# but only its Apache-2 subset - "Community features are not available"
# (https://render.com/docs/postgresql-extensions). That is enough here:
# the app uses core hypertables (chunk exclusion) only; continuous
# aggregates and compression (TSL) are not used, which also keeps the
# stack Apache-2. The Alembic migration runs CREATE EXTENSION timescaledb
# (inside the preDeployCommand's provision step), so the extension is
# provisioned at deploy. Worth one live confirmation that
# create_hypertable succeeds on the plan before the demo leans on it.

services:
  - type: web
    name: glasshouse-web
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz # exempt from the demo login by design, as is /readyz
    preDeployCommand: uv run python -m glasshouse.cli provision
    domains:
      - glasshouse.a115.co.uk
    envVars:
      - key: GLASSHOUSE_ENVIRONMENT
        value: demo
      - key: GLASSHOUSE_DEMO_PASSWORD
        sync: false # prompted at Blueprint creation; lives only in Render
      - key: GLASSHOUSE_DATABASE_URL
        fromDatabase:
          name: glasshouse-db
          property: connectionString
      # Managed Postgres hides the platform's own sessions from this role
      # and grants no pg_read_all_stats, so the audit tail's resume
      # horizon cannot be computed over all sessions and refuses rather
      # than risk skipping a row. Every Glasshouse write connects as the
      # database's single user, so asserting it restores the horizon
      # (the binary verifies the assertion against the catalogue). Taken
      # from the database itself, never a copied literal.
      - key: GLASSHOUSE_AUDIT_WRITER_ROLES
        fromDatabase:
          name: glasshouse-db
          property: user

  - type: cron
    name: glasshouse-seed-reset
    runtime: docker
    schedule: "30 2 * * *"
    # The nightly reset to the known Monday-morning book; also the
    # first-time data load (trigger it manually once after the Blueprint
    # is created). No demo password here: seed never needs one.
    dockerCommand: uv run python -m glasshouse.cli seed --reset
    region: frankfurt
    envVars:
      - key: GLASSHOUSE_ENVIRONMENT
        value: demo
      - key: GLASSHOUSE_DATABASE_URL
        fromDatabase:
          name: glasshouse-db
          property: connectionString
      # The seed rebuilds the projections and verifies all six legs, so
      # it tails the audit twice: it needs the assertion as much as the
      # web service does (see the note there).
      - key: GLASSHOUSE_AUDIT_WRITER_ROLES
        fromDatabase:
          name: glasshouse-db
          property: user

databases:
  - name: glasshouse-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "18"
