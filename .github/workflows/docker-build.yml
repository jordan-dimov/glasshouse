name: Docker build

# The deployment image and CI's integration leg now install the SAME
# pinned release binary from scripts/install-morpholog.sh, so the old
# "deployment binary differs from the CI binary" gap is closed by
# construction. What is left for this job is the image itself: a bad
# COPY, a stale base, an install script that works on a runner and not in
# the fetch stage. Since the build no longer compiles anything, it is
# cheap enough to run on every PR - and the checked-in image is the
# demo's only deployment path, so a break should never wait for a push to
# main to surface.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: glasshouse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Building is not running. The image must carry the pinned binary,
      # and `uv run` inside it must find a complete environment without
      # syncing: a container that re-syncs at start pulls the dev group
      # back in over the network before serving anything (the nightly
      # reset job did exactly that until UV_NO_SYNC).
      - name: The image runs what it ships
        run: |
          docker run --rm glasshouse:ci morpholog --version
          docker run --rm --network none glasshouse:ci uv run python -m glasshouse.cli --help
